        .message-modal #restart{padding:12px 26px;border:0;border-radius:10px;background:linear-gradient(180deg, #fbbf24, #d97706);color:#1f1300;font-weight:800;font-size:13px;letter-spacing:0.06em;cursor:pointer;box-shadow:0 4px 16px rgba(251,191,36,0.35), inset 0 1px 0 rgba(255,255,255,0.5);transition:transform 0.1s}
        .message-modal #restart:active{transform:scale(0.96)}

        .message-modal.win-true h1{color:#86efac}
        @media (max-width:600px){

          #dashBtn{width:56px;height:56px}
          .right-stack{right:14px;bottom:14px}
        }
